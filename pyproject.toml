[project]
name = "review-bot"
version = "0.1.0"
description = "Focused four-agent PR review bot (Phase 2): local CLI that reviews a PR and posts a GitHub App review."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "PyJWT>=2.9",
    "cryptography>=42.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "skills-ref>=0.1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1",
]

[project.scripts]
review-bot = "review_bot.review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["review_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
