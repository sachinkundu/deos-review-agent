schema: spec-driven

context: |
  Project: review-bot — a correctness-focused PR review bot that posts line
  comments as a GitHub App.
  Current scope: local-first CLI that fetches a PR diff via a GitHub App
  installation token, checks out the branch, runs a correctness sub-agent
  through a coordinator, validates diff line locations, and posts a GitHub
  review. Later phases may add tests/safety agents, risk tiers, re-reviews,
  break-glass overrides, and optional integration with external orchestration.
  Engineering preference: readable Python managed with uv, pyproject.toml,
  ruff, pyright, and pytest. Keep the first slice small, deterministic,
  auditable, and safe to run without production credentials or live agent
  side effects. GitHub App credentials must never be committed.

rules:
  proposal:
    - Keep the proposal concise and implementation-oriented.
    - State non-goals explicitly.
    - Prefer Python for agent and CLI code.
  design:
    - Include a component diagram, data flow, minimal data model, and failure modes.
  tasks:
    - Break work into independently verifiable increments.
    - Include deterministic tests before live GitHub integrations.
